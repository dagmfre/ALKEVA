# ALKEVA — Render blueprint, free tier. Price worker only.
#
# The web app and the API moved to Vercel (apps/web and apps/api each have their
# own vercel.json). Render keeps exactly one job: the 30s price tick, which has
# no home on Vercel — Hobby cron fires once a day and a tick loop is a
# long-lived process, not a request.
#
# Free-tier constraints handled here:
#  - No background-worker type on free → the worker runs as a *web* service and
#    binds a health port (apps/worker/src/main.ts::startHealthServer).
#  - No preDeployCommand on free → migrate + seed (both idempotent) run at the
#    start of the startCommand.
#  - Free web services sleep after ~15 min idle. Previously the dashboard's own
#    polling kept this awake; with the API on Vercel, NO ALKEVA traffic reaches
#    Render any more. An external uptime pinger must hit /healthz every ~5 min
#    or the price loop stops. See docs/deploy/vercel-setup.md.
#
# Redis is no longer a Render Key Value service: that one is internal-only
# (ipAllowList: []), and the Vercel API has to reach the same instance the
# worker publishes price:tick to. Both now point at one publicly reachable
# Redis (paste REDIS_URL below and use the identical value on Vercel).
#
# Node version: pinned in .node-version (repo root) — the NODE_VERSION env var
# below only reaches a service on a blueprint sync. An unbounded engines range
# resolves to Node's LATEST release, which put Node 26 on a read-only system
# install where `corepack enable` died with EROFS writing /usr/bin/pnpm.

services:
  - type: web
    name: alkeva-worker
    runtime: node
    plan: free
    # packages/db and packages/shared now compile to dist/ (a Vercel function
    # bundles JS, not `main: src/index.ts`), so a build step is required —
    # the "@alkeva/worker..." filter builds the worker's dependencies.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter "@alkeva/worker..." build
    startCommand: pnpm db:migrate && pnpm db:seed && pnpm --filter @alkeva/worker start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false # Supabase session-pooler connection string
      - key: REDIS_URL
        sync: false # must be the SAME instance the Vercel API subscribes to
      # Required by the shared env schema (loadEnv validates the whole thing).
      # The worker neither issues nor verifies tokens — these only need to
      # satisfy the min-16-char rule. The API's real secrets live on Vercel.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Seed values — this service is the only thing that runs db:seed now.
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_COMPLIANCE_EMAIL
        sync: false
      - key: SEED_COMPLIANCE_PASSWORD
        sync: false
      - key: SEED_FINANCE_EMAIL
        sync: false
      - key: SEED_FINANCE_PASSWORD
        sync: false
      - key: TREASURY_FLOAT_ETB_CENTS
        value: "1000000000"
      - key: TREASURY_HALT_CENTS
        value: "150000000"
      - key: VAULT_SEED_XAU_MG
        value: "5000000"
      - key: VAULT_SEED_XPT_MG
        value: "1000000"
      # Price loop + alert emails (alerts fire from the tick that crosses them).
      - key: PRICE_TICK_SECONDS
        value: "30"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
